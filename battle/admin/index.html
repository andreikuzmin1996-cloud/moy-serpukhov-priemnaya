<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Битва районов — редакция</title><style>*{box-sizing:border-box}body{margin:0;background:#101725;color:white;font:16px system-ui}main{max-width:900px;margin:auto;padding:20px}section{background:#1b2940;border:1px solid #34445c;border-radius:16px;padding:20px;margin:16px 0}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #65758b;margin:5px 0;max-width:100%}input{background:#101725;color:white;width:100%}button{background:#ffcb62;color:#152033;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.tile{background:#293b52;padding:14px;border-radius:12px}.tile strong{display:block;color:#ffcb62;font-size:30px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #34445c}p{color:#bac9dc}[hidden]{display:none!important}</style><main><p>МОЙ СЕРПУХОВ / РЕДАКЦИЯ</p><h1>Битва районов</h1><section><form id="login"><label for="password">Пароль действующей панели статистики</label><input id="password" type="password" autocomplete="current-password" required minlength="20" maxlength="120"><button id="submit">Войти / обновить</button> <button type="button" id="logout">Выйти</button></form><p id="status" role="status">Введите пароль редакции.</p></section><div id="report" hidden><section><h2>Общая статистика</h2><div class="grid" id="metrics"></div></section><section><h2>Мини-игры</h2><div id="games"></div></section><section><h2>Районы</h2><div id="districts"></div></section></div></main><script>'use strict';const $=id=>document.getElementById(id);let seq=0;const metrics={players:"Всего игроков",new_today:"Новых сегодня",active_today:"Активных сегодня",rounds:"Завершено игр",rounds_today:"Игр сегодня",referrals:"Приглашений",rewarded_referrals:"Наград за друзей"};const names={quiz:"Знаток Серпухова",road:"Серпуховские дороги",reaction:"Битва на реакцию",place:"Угадай место"};function line(parent,label,value){const row=document.createElement("div");row.className="row";const a=document.createElement("span"),b=document.createElement("strong");a.textContent=label;b.textContent=value;row.append(a,b);parent.append(row)}$("login").onsubmit=async e=>{e.preventDefault();const n=++seq;$("submit").disabled=true;$("report").hidden=true;$("status").textContent="Загрузка…";try{const r=await fetch("https://poerjmdvjiceepeuxdbv.supabase.co/functions/v1/moi-battle-editor",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value})});const d=await r.json();if(n!==seq)return;if(!r.ok||!d.ok)throw Error(r.status===401?"Неверный пароль":"Сервис недоступен");const s=d.stats;$("metrics").replaceChildren();for(const [k,v] of Object.entries(metrics)){const t=document.createElement("div");t.className="tile";const b=document.createElement("strong");b.textContent=s[k]??0;t.append(b,document.createTextNode(v));$("metrics").append(t)}$("games").replaceChildren();for(const g of s.games)line($("games"),names[g.game]||g.game,g.completed+" из "+g.started+" · "+g.points+" XP");if(!s.games.length)line($("games"),"Пока нет игр","0");$("districts").replaceChildren();for(const d of s.districts)line($("districts"),d.district,d.players);if(!s.districts.length)line($("districts"),"Пока нет игроков","0");$("report").hidden=false;$("status").textContent="Обновлено: "+new Date().toLocaleString("ru-RU",{timeZone:"Europe/Moscow"})+" МСК"}catch(err){if(n===seq)$("status").textContent=err.message}finally{if(n===seq)$("submit").disabled=false}};$("logout").onclick=()=>{seq++;$("password").value="";$("report").hidden=true;for(const id of ["metrics","games","districts"])$(id).replaceChildren();$("submit").disabled=false;$("status").textContent="Вы вышли."};</script></html>
