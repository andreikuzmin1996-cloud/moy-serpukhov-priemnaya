name: Verify live Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for branch-based Pages publishing and verify production routes
        run: |
          set -e
          for i in $(seq 1 35); do
            if curl -fLsS --max-time 15 -H 'Cache-Control: no-cache' "https://moi-serpuhov.ru/redakciya/?verify=$i" -o /tmp/editor.html &&
               grep -q 'request_link' /tmp/editor.html &&
               grep -q 'Вход без пароля' /tmp/editor.html &&
               curl -fLsS --max-time 15 -H 'Cache-Control: no-cache' "https://moi-serpuhov.ru/narodny-kontrol.html?verify=$i" -o /tmp/control.html &&
               grep -q 'caseForm' /tmp/control.html; then
              echo "Production editor and control pages confirmed available."
              exit 0
            fi
            sleep 12
          done
          echo "Production URL did not pass verification."
          exit 1
